<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orildo — React Spatial Operating System</title>
  <meta name="description" content="Orildo Technology React Application — Immersive local-first spatial operating system engineered by Founder & CEO Syed Sameer Ul Hassan.">
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('orildo_theme');
      const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute('data-theme', savedTheme || (prefersLight ? 'light' : 'dark'));
    })();
  </script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
